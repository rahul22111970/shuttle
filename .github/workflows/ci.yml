# SHUTTLE CI: the standing gates from BACKLOG.md, run on every push.
name: ci

on: [push]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export -p web

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The standing-gate grep. The bracketed characters stop this file from
      # matching its own pattern; the strings it hunts are service(_)role and
      # client(_)secret in any non-markdown file.
      #
      # -l prints only filenames: the scanner must never echo the caught value
      # into a CI log, which outlives the push that removes it from history.
      #
      # Proven to fail, not assumed: branch ci-secret-scan-fixture added a file
      # containing a fake service(_)role string; secret-scan went red while the
      # other three jobs stayed green, on run 31204102475, and again after
      # review hardening with -l in place, logging the filename only, on run
      # 31204428956. The branch was deleted after. Run references also in the commit message that
      # introduced this workflow.
      - run: |
          if git grep -liE 'service_r[o]le|client_secr[e]t' -- ':!*.md'; then
            echo 'secret-like string committed; see secret-scan in ci.yml'
            exit 1
          fi

  # Deploys develop to the shuttle-staging Vercel project (its env points at
  # the staging Supabase). Same gates, different target: risky work bakes
  # here before it may merge to main.
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: [typecheck, test, export, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the canonical domain, not the per-deployment URL: unique deployment
      # URLs sit behind Vercel's deployment protection and would 401 here
      - run: |
          npx vercel@54.13.0 deploy --prod --yes --token "$VERCEL_TOKEN"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://shuttle-staging.vercel.app)" = 200
          curl -s https://shuttle-staging.vercel.app | grep -q 'id="root"'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

  # Deploys only from main, only after every gate is green. The token enters
  # the shell as env and reaches the CLI via expansion, so the workflow-rendered
  # command never contains it and GitHub masks it in logs. Actions are
  # SHA-pinned file-wide because this job is the moment a real credential
  # entered CI.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [typecheck, test, export, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npx vercel@54.13.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The definition of done's point 8, machine-checked: the production
      # domain answers 200 and serves the app root, or this push is red.
      # The bundle grep exists because a 200 with the root element proved
      # nothing on 2026-08-08: builds without their EXPO_PUBLIC env crashed
      # at import and served a blank page all night. It greps for the
      # PROJECT host, not supabase.co generically, because supabase-js ships
      # "*.supabase.co" in its own bundled code regardless of env; only the
      # project URL enters the bundle by env inlining. The host is public by
      # design: it is in every request the app makes.
      - run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://shuttle-ten-chi.vercel.app)" = 200
          html=$(curl -s https://shuttle-ten-chi.vercel.app)
          echo "$html" | grep -q 'id="root"'
          bundle=$(echo "$html" | grep -oE '/_expo/static/js/web/[^"]+\.js' | head -1)
          test -n "$bundle"
          curl -s "https://shuttle-ten-chi.vercel.app$bundle" | grep -q 'wpsvzxdbnfinliqzfjik\.supabase\.co'
